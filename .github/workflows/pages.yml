name: Publish LiangCe Web
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 4,7 * * 1-5'
permissions:
  contents: read
concurrency:
  group: liangce-pages
  cancel-in-progress: false
jobs:
  publish:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/tdx-api/go.sum
      - name: Restore recent market cache
        uses: actions/cache@v4
        with:
          path: runtime/data
          key: liangce-data-${{ github.run_id }}
          restore-keys: liangce-data-
      - name: Build TDX service
        working-directory: services/tdx-api
        run: go build -o ../../tdx-api-service .
      - name: Test
        run: |
          python -m unittest test_batch_analysis test_market_runtime test_local_tdx test_v2_results test_web_server test_site_export
          node --test '*.test.cjs'
      - name: Collect actual market data
        run: python tools/collect_snapshot.py
      - name: Build published site
        run: python tools/build_site.py
      - name: Publish website files to the public site repository
        env:
          LIANGCE_SITE_REPOSITORY: nnn256/LiangCe-site
          LIANGCE_SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: python tools/publish_site.py

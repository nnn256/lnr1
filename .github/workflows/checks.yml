name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_batch_analysis test_market_runtime test_local_tdx test_v2_results test_web_server test_site_export test_sector_data
      - run: node --test '*.test.cjs'
